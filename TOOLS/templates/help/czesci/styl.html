<style>
        :root {
            --bg: #212529;
            --bg-soft: #2d3238;
            --bg-card: #343a40;
            --text: #dee2e6;
            --text-muted: #adb5bd;
            --accent: #ffc107;
            --primary: #0d6efd;
            --success: #198754;
            --warning: #ffc107;
            --orange: #fb923c;
            --danger: #dc3545;
            --info: #0dcaf0;
            --secondary: #6c757d;
            --border: #495057;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 32px 28px 80px;
        }
        header.page-head {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 16px;
            margin-bottom: 28px;
        }
        h1 {
            margin: 0 0 6px;
            color: var(--accent);
            font-size: 1.85rem;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        h2 {
            color: var(--accent);
            margin-top: 42px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            font-size: 1.4rem;
        }
        h3 {
            color: #ffda6a;
            margin-top: 26px;
            font-size: 1.1rem;
        }
        h4 {
            color: var(--text);
            margin-top: 22px;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        p { margin: 8px 0; }
        ul, ol { padding-left: 22px; }
        li { margin-bottom: 6px; }
        strong { color: #fff; }
        code {
            background: var(--bg-soft);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.88em;
            color: #ffda6a;
            border: 1px solid var(--border);
        }
        .toc {
            background: var(--bg-soft);
            border-left: 4px solid var(--accent);
            padding: 14px 22px;
            border-radius: 4px;
            margin-bottom: 28px;
        }
        .toc strong { color: var(--accent); }
        .toc ol { margin: 8px 0 0; }
        .toc a {
            color: var(--text);
            text-decoration: none;
        }
        .toc a:hover { color: var(--accent); text-decoration: underline; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 20px;
            margin: 14px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .tip {
            background: rgba(13, 202, 240, 0.08);
            border-left: 4px solid var(--info);
            padding: 12px 16px;
            margin: 14px 0;
            border-radius: 0 4px 4px 0;
        }
        .warn {
            background: rgba(251, 146, 60, 0.1);
            border-left: 4px solid var(--orange);
            padding: 12px 16px;
            margin: 14px 0;
            border-radius: 0 4px 4px 0;
        }
        .danger-box {
            background: rgba(220, 53, 69, 0.1);
            border-left: 4px solid var(--danger);
            padding: 12px 16px;
            margin: 14px 0;
            border-radius: 0 4px 4px 0;
        }

        /* Statusy — w postaci znaczków, ten sam styl co w aplikacji */
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
        }
        .tag.draft { background: var(--secondary); }
        .tag.pending { background: var(--warning); color: #000; }
        .tag.verified { background: var(--info); color: #000; }
        .tag.sent { background: var(--primary); }
        .tag.partial { background: var(--orange); color: #431407; }
        .tag.completed { background: var(--success); }

        .status-table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
        }
        .status-table th, .status-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .status-table th {
            background: var(--bg-soft);
            color: var(--accent);
        }

        /* Diagram */
        .diagram {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            margin: 20px 0;
            text-align: center;
            overflow-x: auto;
        }
        .diagram svg {
            max-width: 100%;
            height: auto;
        }
        .diagram-caption {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        kbd {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-bottom-width: 2px;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 0.85em;
            font-family: monospace;
            color: var(--accent);
        }

        .btn-demo {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            margin: 0 2px;
            white-space: nowrap;
        }
        .btn-demo.success { background: var(--success); }
        .btn-demo.primary { background: var(--primary); }
        .btn-demo.warn { background: var(--orange); color: #431407; }
        .btn-demo.info { background: var(--info); color: #000; }
        .btn-demo.danger { background: var(--danger); }
        .btn-demo.secondary { background: var(--secondary); }

        footer {
            margin-top: 60px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        /* Stany egzemplarzy (Magazyn) */
        .tag.nowe { background: var(--success); }
        .tag.uzywane { background: var(--info); color: #000; }
        .tag.uszkodzone { background: var(--danger); }
        .tag.zuzyte { background: var(--orange); color: #431407; }
        .btn-demo.purple { background: #6f42c1; }

        /* Zakupy: kolory statusów jak w zakładce „Zamówienia” modułu Zakupy */
        .dok-zakupy .tag.sent { background: #60a5fa; color: #030712; }
        .dok-zakupy .tag.partial { background: var(--warning); color: #000; }

        /* Pasek stanu (jak w tabeli "Lista narzędzi") — kolory zgodne z Zakupy.vue */
        .dot {
            display: inline-block;
            width: 12px;
            height: 20px;
            border-radius: 2px;
            vertical-align: middle;
            margin-right: 6px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
        }
        .dot.green { background: #198754; }
        .dot.orange { background: #d97706; }
        .dot.red { background: #dc3545; }
        .dot.grey { background: #495057; }
        .opis-hist { color: #e2d07a; font-weight: 600; }

        /* Pełna dokumentacja — podział na części */
        .dok-okladka { border-bottom: 3px solid var(--accent); }
        .dok-czesci-lista li { margin-bottom: 10px; }
        .dok-czesci-lista .opis { display: block; color: var(--text-muted); font-size: 0.9rem; }
        .dok-separator {
            margin: 70px 0 20px;
            padding-top: 10px;
            border-top: 3px double var(--border);
            text-align: right;
            font-size: 0.85rem;
        }
        @media print {
            .dok-separator { page-break-before: always; border: none; margin-top: 0; }
            .dok-separator a { display: none; }
        }
    </style>
