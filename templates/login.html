<!DOCTYPE html>
{% load static %}
<html lang="pl" style="background-color: #1a1d21;">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - CNCTools</title>
    <link rel="icon" href="{% static 'images/cnc-logo.png' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1d21 0%, #2d3238 50%, #1a1d21 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-container {
            background: rgba(37, 42, 48, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 360px;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }
        h2 {
            color: #e9ecef;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #adb5bd;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #3d444d;
            border-radius: 6px;
            background-color: #2b3035;
            color: #e9ecef;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
        }
        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #6c757d;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .error {
            color: #ea868f;
            background-color: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }
        .version-info {
            color: #6c757d;
            font-size: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #3d444d;
        }
        .version-info b {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="{% static 'images/cnc-logo.png' %}" alt="CNC Tools Logo" class="logo">
        <h2>Zaloguj się</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Nazwa użytkownika</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="id_password">Hasło</label>
                {{ form.password }}
            </div>
            {% if form.errors %}
                <p class="error">Nazwa użytkownika lub hasło są nieprawidłowe.</p>
            {% endif %}
            <button type="submit">Zaloguj</button>
        </form>
        <div class="version-info">
            <b>CNC-Tools</b> ver. {{ info_program.WERSJA }} <i>{{ info_program.MODYFIKACJA }}</i>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then(registration => {
                        console.log('Service Worker zarejestrowany pomyślnie z zasięgiem: ', registration.scope);
                    })
                    .catch(registrationError => {
                        console.log('Błąd rejestracji Service Workera: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
